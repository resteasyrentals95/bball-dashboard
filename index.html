<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#012169">
<title>Duke MBB + NBA Dashboard</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141922; --panel2:#1b2330; --border:#28323f;
    --text:#eef3f9; --muted:#93a0b1; --win:#3fb950; --live:#ff4d4d;
    /* theme vars (overridden per tab) */
    --primary:#012169; --primary2:#0736A4; --accent:#5b9bff; --chip:#0736A4;
  }
  body.theme-duke{ --primary:#001A57; --primary2:#0a4bd8; --accent:#5b9bff; --chip:#0a4bd8; }
  body.theme-nba{  --primary:#1d428a; --primary2:#c8102e; --accent:#ff6b7d; --chip:#c8102e; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased;
    transition:background .3s}
  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:20;
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);
    padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    box-shadow:0 4px 18px rgba(0,0,0,.45);transition:background .3s}
  .logo-badge{width:52px;height:52px;border-radius:50%;background:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .logo-badge img{width:40px;height:40px;object-fit:contain}
  .htext{flex:1;min-width:0}
  .htext h1{margin:0;font-size:19px;letter-spacing:.2px;line-height:1.15}
  .htext .sub{font-size:12px;opacity:.9;margin-top:2px}
  .updated{font-size:11px;opacity:.85;white-space:nowrap}
  /* ---------- tabs ---------- */
  .tabbar{position:sticky;top:84px;z-index:15;background:var(--bg);padding:12px 20px 4px;
    display:flex;gap:10px;border-bottom:1px solid var(--border)}
  .tab{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);
    color:var(--text);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:700}
  .tab img{width:20px;height:20px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
  .tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:transparent}
  /* ---------- layout ---------- */
  .wrap{max-width:1120px;margin:0 auto;padding:18px 20px 40px}
  .grid{display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:860px){.grid{grid-template-columns:1.1fr .9fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,.02)}
  .card h2{margin:0;padding:13px 16px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;
    color:#fff;border-bottom:1px solid var(--border);
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    display:flex;align-items:center;gap:8px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .card .body{padding:4px 0}
  /* ---------- news ---------- */
  .news{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);
    text-decoration:none;color:inherit}
  .news:last-child{border-bottom:none}
  .news:hover{background:var(--panel2)}
  .news .thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:var(--panel2)}
  .news .txt{min-width:0}
  .news .hl{font-weight:650;font-size:14.5px}
  .news .desc{color:var(--muted);font-size:12.5px;margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .news .row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--muted)}
  .news .src{font-weight:600;color:var(--accent)}
  .news .src::after{content:"·";margin-left:8px;color:var(--muted);font-weight:400}
  .badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
    padding:2px 8px;border-radius:6px;background:var(--accent);color:#06121f}
  /* ---------- games ---------- */
  .game{padding:14px 16px;border-bottom:1px solid var(--border)}
  .game:last-child{border-bottom:none}
  .gstatus{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    margin-bottom:9px;display:flex;justify-content:space-between}
  .gstatus .live{color:var(--live);font-weight:800}
  .gstatus .final{color:var(--win);font-weight:800}
  .team{display:flex;align-items:center;gap:11px;padding:4px 0}
  .team img{width:28px;height:28px;object-fit:contain}
  .team .tn{flex:1;font-weight:650;font-size:14.5px}
  .team .rec{color:var(--muted);font-size:11.5px;font-weight:400}
  .team .sc{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;min-width:36px;text-align:right}
  .team.w .tn,.team.w .sc{color:var(--win)}
  .leaders{margin-top:11px;border-top:1px dashed var(--border);padding-top:9px}
  .leaders .lt{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
  .leaders ul{margin:0;padding-left:0;list-style:none}
  .leaders li{font-size:12.5px;padding:2px 0}
  .leaders li b{color:var(--accent);font-weight:800}
  .empty{padding:24px 16px;color:var(--muted);font-size:13px;text-align:center}
  .pane{display:none}.pane.active{display:block}
  footer{max-width:1120px;margin:0 auto;padding:0 20px 36px;color:var(--muted);font-size:11.5px}
  .err{background:#3d1d1d;border:1px solid #5c2626;color:#f7b5b5;padding:8px 12px;border-radius:8px;
    margin:0 0 14px;font-size:12.5px}
</style>
</head>
<body class="theme-duke">
<header>
  <div class="logo-badge"><img id="hlogo" alt="logo"></div>
  <div class="htext">
    <h1 id="htitle">Duke Blue Devils</h1>
    <div class="sub" id="hsub">Men's Basketball</div>
  </div>
  <div class="updated" id="updated"></div>
</header>
<div class="tabbar">
  <button class="tab active" data-pane="duke" id="tab-duke">
    <img src="https://a.espncdn.com/i/teamlogos/ncaa/500/150.png" alt="">Duke
  </button>
  <button class="tab" data-pane="nba" id="tab-nba">
    <img src="https://a.espncdn.com/i/teamlogos/leagues/500/nba.png" alt="">NBA
  </button>
</div>
<div class="wrap">
  <div id="errbox"></div>
  <div class="pane active" id="pane-duke"></div>
  <div class="pane" id="pane-nba"></div>
</div>
<footer id="footer"></footer>

<script>
const DATA = {"generated_at": "2026-06-23T14:16:37.870306+00:00", "duke": {"news": [], "games": []}, "nba": {"news": [], "games": []}, "errors": []};
const THEME = {
  duke:{cls:"theme-duke", logo:"https://a.espncdn.com/i/teamlogos/ncaa/500/150.png",
        title:"Duke Blue Devils", sub:"Men's Basketball", color:"#012169",
        newsTitle:"News & Recruiting"},
  nba:{cls:"theme-nba", logo:"https://a.espncdn.com/i/teamlogos/leagues/500/nba.png",
        title:"NBA", sub:"Around the league", color:"#1d428a",
        newsTitle:"Latest Headlines"},
};

function fmtTime(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";
  return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}
function timeAgo(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";
  const s=(Date.now()-d.getTime())/1000;
  if(s<3600)return Math.max(1,Math.round(s/60))+"m ago";
  if(s<86400)return Math.round(s/3600)+"h ago";return Math.round(s/86400)+"d ago";}
function esc(t){const e=document.createElement("div");e.textContent=t==null?"":t;return e.innerHTML;}

function newsCard(title,articles){
  let inner = (!articles||!articles.length)
    ? `<div class="empty">No headlines available right now.</div>`
    : articles.map(a=>`
      <a class="news" href="${esc(a.link)}" target="_blank" rel="noopener">
        ${a.image?`<img class="thumb" src="${esc(a.image)}" alt="" loading="lazy">`:""}
        <div class="txt">
          <div class="hl">${esc(a.headline)}</div>
          ${a.description?`<div class="desc">${esc(a.description)}</div>`:""}
          <div class="row">
            ${a.recruiting?`<span class="badge">Recruiting</span>`:""}
            ${a.source?`<span class="src">${esc(a.source)}</span>`:""}
            <span>${esc(timeAgo(a.published))}</span>
          </div>
        </div>
      </a>`).join("");
  return `<div class="card"><h2><span class="dot"></span>${esc(title)}</h2><div class="body">${inner}</div></div>`;
}

function gameBlock(g){
  const cls = g.state==="in"?"live":(g.completed?"final":"");
  const teams=(g.competitors||[]).map(c=>`
    <div class="team ${c.winner?'w':''}">
      ${c.logo?`<img src="${esc(c.logo)}" alt="">`:`<span style="width:28px"></span>`}
      <span class="tn">${esc(c.name)} ${c.record?`<span class="rec">(${esc(c.record)})</span>`:""}</span>
      <span class="sc">${esc(c.score)}</span>
    </div>`).join("");
  let leaders="";
  const lk=Object.keys(g.leaders||{});
  if(lk.length){
    const items=lk.flatMap(t=>(g.leaders[t]||[]).map(l=>`<li><b>${esc(t)}</b> · ${esc(l)}</li>`)).join("");
    if(items)leaders=`<div class="leaders"><div class="lt">Top stat lines</div><ul>${items}</ul></div>`;
  }
  return `<div class="game">
    <div class="gstatus"><span class="${cls}">${esc(g.status||"")}</span><span>${esc(fmtTime(g.date))}</span></div>
    ${teams}${leaders}</div>`;
}

function gamesCard(title,games){
  const inner=(!games||!games.length)
    ? `<div class="empty">No games scheduled or recently played.</div>`
    : games.map(gameBlock).join("");
  return `<div class="card"><h2><span class="dot"></span>${esc(title)}</h2><div class="body">${inner}</div></div>`;
}

function renderPane(league){
  const d=DATA[league]||{news:[],games:[]};
  document.getElementById("pane-"+league).innerHTML=`
    <div class="grid">
      ${newsCard(THEME[league].newsTitle,d.news)}
      ${gamesCard("Scores & Top Stat Lines",d.games)}
    </div>`;
}

function applyTheme(league){
  const t=THEME[league];
  document.body.className=t.cls;
  document.getElementById("hlogo").src=t.logo;
  document.getElementById("htitle").textContent=t.title;
  document.getElementById("hsub").textContent=t.sub;
  const meta=document.querySelector('meta[name=theme-color]');if(meta)meta.content=t.color;
}

function init(){
  if(!DATA){document.getElementById("errbox").innerHTML=
    `<div class="err">No data yet. Run <code>fetch_data.py</code> to populate.</div>`;return;}
  document.getElementById("updated").textContent="Updated "+fmtTime(DATA.generated_at)+" · 8 AM & 8 PM";
  if(DATA.errors&&DATA.errors.length)
    document.getElementById("errbox").innerHTML=`<div class="err">Some sources failed: ${esc(DATA.errors.join("; "))}</div>`;
  renderPane("duke");renderPane("nba");applyTheme("duke");
  document.getElementById("footer").innerHTML=
    "Data &amp; logos: ESPN · Times in your local timezone · Personal fan dashboard.";
  document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".pane").forEach(x=>x.classList.remove("active"));
    tab.classList.add("active");
    const league=tab.dataset.pane;
    document.getElementById("pane-"+league).classList.add("active");
    applyTheme(league);
  }));
  // Auto-refresh: reload the published page every 5 min so an open tab stays current.
  setInterval(()=>{ if(document.visibilityState==="visible") location.reload(); }, 300000);
}
init();
</script>
</body>
</html>
