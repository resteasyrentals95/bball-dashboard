<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duke MBB + NBA Dashboard</title>
<style>
  :root{
    --duke:#003087; --duke-light:#0a4bd0; --bg:#0d1117; --panel:#161b22;
    --panel2:#1c2330; --border:#2a3340; --text:#e6edf3; --muted:#8b97a6;
    --accent:#f5a623; --win:#3fb950; --live:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.45}
  header{background:linear-gradient(135deg,var(--duke),var(--duke-light));padding:18px 22px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    box-shadow:0 2px 12px rgba(0,0,0,.4)}
  header h1{margin:0;font-size:20px;letter-spacing:.3px}
  header .meta{font-size:12px;opacity:.85}
  .wrap{max-width:1100px;margin:0 auto;padding:18px}
  .tabs{display:flex;gap:8px;margin:6px 0 18px}
  .tab{background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:9px 18px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600}
  .tab.active{background:var(--duke-light);border-color:var(--duke-light)}
  .grid{display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:820px){.grid{grid-template-columns:1.1fr .9fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .card h2{margin:0;padding:13px 16px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--muted);border-bottom:1px solid var(--border);background:var(--panel2)}
  .card .body{padding:6px 0}
  /* news */
  .news{display:block;padding:12px 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
  .news:last-child{border-bottom:none}
  .news:hover{background:var(--panel2)}
  .news .hl{font-weight:600;font-size:14.5px}
  .news .desc{color:var(--muted);font-size:13px;margin-top:3px}
  .news .row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--muted)}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    padding:2px 7px;border-radius:5px;background:var(--accent);color:#1a1100}
  /* games */
  .game{padding:12px 16px;border-bottom:1px solid var(--border)}
  .game:last-child{border-bottom:none}
  .gstatus{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:7px;
    display:flex;justify-content:space-between}
  .gstatus .live{color:var(--live);font-weight:700}
  .gstatus .final{color:var(--win);font-weight:700}
  .team{display:flex;align-items:center;gap:10px;padding:3px 0}
  .team img{width:24px;height:24px;object-fit:contain}
  .team .tn{flex:1;font-weight:600;font-size:14px}
  .team .rec{color:var(--muted);font-size:11.5px;font-weight:400}
  .team .sc{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;min-width:34px;text-align:right}
  .team.w .tn,.team.w .sc{color:var(--win)}
  .leaders{margin-top:9px;border-top:1px dashed var(--border);padding-top:8px}
  .leaders .lt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .leaders ul{margin:4px 0 0;padding-left:0;list-style:none}
  .leaders li{font-size:12.5px;padding:1px 0;color:var(--text)}
  .leaders li b{color:var(--accent);font-weight:600}
  .empty{padding:22px 16px;color:var(--muted);font-size:13px;text-align:center}
  .pane{display:none}
  .pane.active{display:block}
  footer{max-width:1100px;margin:8px auto 30px;padding:0 18px;color:var(--muted);font-size:11.5px}
  .err{background:#3d1d1d;border:1px solid #5c2626;color:#f7b5b5;padding:8px 12px;border-radius:8px;
    margin-bottom:14px;font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>🏀 Duke MBB &amp; NBA — Daily Dashboard</h1>
  <div class="meta" id="meta"></div>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-pane="duke">Duke Blue Devils</button>
    <button class="tab" data-pane="nba">NBA</button>
  </div>
  <div id="errbox"></div>
  <div class="pane active" id="pane-duke"></div>
  <div class="pane" id="pane-nba"></div>
</div>
<footer id="footer"></footer>

<script>
const DATA = /*__DATA__*/null;

function fmtTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return "";
  return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function timeAgo(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  const s = (Date.now()-d.getTime())/1000;
  if(s<3600) return Math.max(1,Math.round(s/60))+"m ago";
  if(s<86400) return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}
function esc(t){const e=document.createElement("div");e.textContent=t==null?"":t;return e.innerHTML;}

function newsCard(title, articles){
  let inner = "";
  if(!articles || !articles.length){
    inner = `<div class="empty">No headlines available right now.</div>`;
  } else {
    inner = articles.map(a=>`
      <a class="news" href="${esc(a.link)}" target="_blank" rel="noopener">
        <div class="hl">${esc(a.headline)}</div>
        ${a.description?`<div class="desc">${esc(a.description)}</div>`:""}
        <div class="row">
          ${a.recruiting?`<span class="badge">Recruiting</span>`:""}
          <span>${esc(timeAgo(a.published))}</span>
        </div>
      </a>`).join("");
  }
  return `<div class="card"><h2>${esc(title)}</h2><div class="body">${inner}</div></div>`;
}

function gameBlock(g){
  const statusCls = g.state==="in" ? "live" : (g.completed ? "final" : "");
  const teams = (g.competitors||[]).map(c=>`
    <div class="team ${c.winner?'w':''}">
      ${c.logo?`<img src="${esc(c.logo)}" alt="">`:`<span style="width:24px"></span>`}
      <span class="tn">${esc(c.name)} ${c.record?`<span class="rec">(${esc(c.record)})</span>`:""}</span>
      <span class="sc">${esc(c.score)}</span>
    </div>`).join("");
  let leaders = "";
  const lk = Object.keys(g.leaders||{});
  if(lk.length){
    const items = lk.flatMap(team =>
      (g.leaders[team]||[]).map(l=>`<li><b>${esc(team)}</b> · ${esc(l)}</li>`)
    ).join("");
    if(items){
      leaders = `<div class="leaders"><div class="lt">Top stat lines</div><ul>${items}</ul></div>`;
    }
  }
  return `<div class="game">
    <div class="gstatus"><span class="${statusCls}">${esc(g.status||"")}</span><span>${esc(fmtTime(g.date))}</span></div>
    ${teams}${leaders}
  </div>`;
}

function gamesCard(title, games){
  let inner;
  if(!games || !games.length){
    inner = `<div class="empty">No games scheduled or recently played.</div>`;
  } else {
    inner = games.map(gameBlock).join("");
  }
  return `<div class="card"><h2>${esc(title)}</h2><div class="body">${inner}</div></div>`;
}

function renderPane(id, league, newsTitle){
  const d = DATA[league] || {news:[],games:[]};
  document.getElementById("pane-"+id).innerHTML = `
    <div class="grid">
      ${newsCard(newsTitle, d.news)}
      ${gamesCard("Scores & Top Stat Lines", d.games)}
    </div>`;
}

function init(){
  if(!DATA){document.getElementById("errbox").innerHTML =
    `<div class="err">No data loaded yet. Run <code>fetch_data.py</code> to populate the dashboard.</div>`;return;}
  document.getElementById("meta").textContent = "Updated " + fmtTime(DATA.generated_at) +
    " · auto-refreshes 8 AM & 8 PM";
  if(DATA.errors && DATA.errors.length){
    document.getElementById("errbox").innerHTML =
      `<div class="err">Some sources failed this run: ${esc(DATA.errors.join("; "))}</div>`;
  }
  renderPane("duke","duke","Duke Men's Basketball — News & Recruiting");
  renderPane("nba","nba","NBA — Latest Headlines");
  document.getElementById("footer").innerHTML =
    "Data: ESPN public endpoints · Times shown in your local timezone · Open this file anytime for the latest saved update.";
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".pane").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("pane-"+t.dataset.pane).classList.add("active");
  }));
}
init();
</script>
</body>
</html>
